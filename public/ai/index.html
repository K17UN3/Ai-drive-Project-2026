<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI質問機能</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 16px;
      color: #333;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.5rem;
      border-bottom: 2px solid #eaeaea;
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      font-size: 1rem;
    }
    textarea:disabled, button:disabled {
      background-color: #e9ecef;
      cursor: not-allowed;
    }
    button {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background-color: #0056b3;
    }
    .status-msg {
      margin: 12px 0;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .status-msg.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .status-msg.info {
      background-color: #e2e3e5;
      color: #383d41;
    }
    .history-section {
      margin-top: 32px;
    }
    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .history-item {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
      background-color: #fafafa;
    }
    .history-header {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 8px;
    }
    .history-prompt {
      font-weight: bold;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    .history-response {
      white-space: pre-wrap;
      color: #2b2b2b;
      background: #fff;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #eaeaea;
    }
    .empty-state {
      padding: 24px;
      text-align: center;
      color: #6c757d;
      background-color: #f8f9fa;
      border-radius: 4px;
      border: 1px dashed #dee2e6;
    }
    .nav-links {
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <h1>AI質問機能</h1>

  <section class="qa-form-section">
    <form id="qa-form">
      <div class="form-group">
        <label for="question-input"><strong>質問を入力してください (1〜2000文字):</strong></label><br>
        <textarea id="question-input" placeholder="質問を入力してください..." disabled></textarea>
      </div>
      <button id="submit-btn" type="submit" disabled>質問を送信</button>
    </form>
  </section>

  <div id="status-area"></div>

  <section class="history-section">
    <h2>過去の質問履歴 (最新20件)</h2>
    <div id="history-container">
      <div class="status-msg info">履歴を読み込み中...</div>
    </div>
  </section>

  <div class="nav-links">
    <a href="/">TOPページへ</a> | <a href="/todo">TODOアプリへ</a>
  </div>

  <script src="/ai/app.js"></script>
</body>
</html>
