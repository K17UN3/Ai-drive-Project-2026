<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI質問機能 V2（会話スレッド・文脈継続）</title>
  <style>
    :root {
      --bg-app: #f4f6f9;
      --bg-panel: #ffffff;
      --bg-sidebar: #f8fafc;
      --border-color: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --active-bg: #eff6ff;
      --active-border: #3b82f6;
      --user-bubble: #2563eb;
      --user-text: #ffffff;
      --model-bubble: #f1f5f9;
      --model-text: #0f172a;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
      --error-border: #fecaca;
      --info-bg: #f1f5f9;
      --info-text: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header.app-header {
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    header.app-header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .nav-links {
      font-size: 0.875rem;
    }

    .nav-links a {
      color: var(--primary);
      text-decoration: none;
      margin-left: 12px;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }

    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      background-color: var(--bg-panel);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    /* 左ペイン：会話一覧 */
    aside.sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .btn-new-chat {
      width: 100%;
      padding: 10px 14px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn-new-chat:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-new-chat:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .sidebar-section-title {
      padding: 12px 16px 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .conversation-list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 16px;
    }

    .conversation-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .conversation-item {
      margin-bottom: 6px;
    }

    .conversation-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      background-color: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-main);
      transition: background-color 0.15s, border-color 0.15s;
    }

    .conversation-btn:hover:not(:disabled) {
      background-color: #e2e8f0;
    }

    .conversation-btn.active {
      background-color: var(--active-bg);
      border-color: var(--active-border);
    }

    .conversation-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .conv-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .conv-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .empty-conversations {
      padding: 16px 8px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 右ペイン：対話エリア */
    main.chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-panel);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-header-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-left: 12px;
    }

    .turns-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-turns {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      padding: 24px;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      background-color: var(--bg-sidebar);
      max-width: 440px;
    }

    .turn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
    }

    .msg-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.model {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
    }

    .msg-row.user .msg-bubble {
      background-color: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .msg-row.model .msg-bubble {
      background-color: var(--model-bubble);
      color: var(--model-text);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .status-area {
      padding: 0 20px;
    }

    .status-msg {
      margin-top: 8px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
    }

    .status-msg.error {
      background-color: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }

    .status-msg.info {
      background-color: var(--info-bg);
      color: var(--info-text);
      border: 1px solid var(--border-color);
    }

    .composer-section {
      padding: 14px 20px 18px;
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-panel);
    }

    .composer-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .composer-textarea {
      width: 100%;
      min-height: 76px;
      max-height: 200px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
    }

    .composer-textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .composer-textarea:disabled {
      background-color: #f1f5f9;
      cursor: not-allowed;
    }

    .composer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .char-counter {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .btn-submit {
      padding: 8px 20px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      .workspace {
        flex-direction: column;
      }
      aside.sidebar {
        width: 100%;
        max-height: 200px;
        border-right: none;
        border-bottom: 1px solid var(--border-color);
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>AI質問機能 V2（連続対話・会話管理）</h1>
    <nav class="nav-links">
      <a href="/ai">V1単発版へ</a>
      <a href="/todo">TODOアプリへ</a>
      <a href="/">TOPへ</a>
    </nav>
  </header>

  <div class="workspace">
    <!-- 左ペイン：会話一覧 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" type="button" class="btn-new-chat">＋ 新しい会話</button>
      </div>
      <div class="sidebar-section-title">保存済みの会話一覧</div>
      <div id="conversation-list-container" class="conversation-list-container">
        <div class="empty-conversations">読み込み中...</div>
      </div>
    </aside>

    <!-- 右ペイン：選択中の会話履歴と質問入力 -->
    <main class="chat-area">
      <div class="chat-header">
        <h2 id="current-chat-title" class="chat-header-title">新しい会話</h2>
        <span id="current-chat-meta" class="chat-header-meta">直近5往復の文脈を保持・最大20往復表示</span>
      </div>

      <div id="turns-container" class="turns-container">
        <div class="empty-turns">
          質問を入力して送信すると、新しい会話が始まります。<br>
          同じ会話内では直近5往復のやり取りを踏まえてAIが回答します。
        </div>
      </div>

      <div id="status-area" class="status-area"></div>

      <section class="composer-section">
        <form id="qa-form" class="composer-form">
          <textarea
            id="question-input"
            class="composer-textarea"
            placeholder="質問を入力してください（1〜2000文字）..."
            disabled
          ></textarea>
          <div class="composer-footer">
            <span id="char-counter" class="char-counter">0 / 2000 文字</span>
            <button id="submit-btn" type="submit" class="btn-submit" disabled>質問を送信</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="/ai/v2/app.js"></script>
</body>
</html>
